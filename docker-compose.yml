version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: delivery_saas_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    networks:
      - delivery_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    container_name: delivery_saas_redis
    restart: always
    ports:
      - "6379:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    networks:
      - delivery_network
    volumes:
      - redis_data:/data

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: delivery_saas_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${EVOLUTION_DATABASE_NAME:-evolution}?schema=public
      REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_PREFIX_KEY: evolution
      WEBHOOK_GLOBAL_URL: ${APP_URL}/api/webhooks/whatsapp
      WEBHOOK_GLOBAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: ${EVOLUTION_SESSION_PHONE_CLIENT:-delivery-saas}
    depends_on:
      - postgres
      - redis
    networks:
      - delivery_network
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

networks:
  delivery_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  evolution_store:
