version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: delivery_saas_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery-saas
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4
    container_name: delivery_saas_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redis"]
