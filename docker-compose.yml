version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: delivery_saas_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    networks:
      - delivery_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    container_name: delivery_saas_redis
    restart: always
    ports:
      - "6379:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    networks:
      - delivery_network
    volumes:
      - redis_data:/data

networks:
  delivery_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
