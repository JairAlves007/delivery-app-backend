services:
  - type: web
    name: delivery-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3333
      - key: TRUST_PROXY
        value: "true"

      - key: BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: delivery-postgres
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: delivery-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: delivery-postgres
          property: password
      - key: DATABASE_NAME
        fromDatabase:
          name: delivery-postgres
          property: database

      - key: REDIS_HOST
        fromService:
          name: delivery-cache
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: delivery-cache
          type: keyvalue
          property: port

      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_API_KEY
        sync: false

      - key: PUBLIC_BUCKET_URL
        sync: false
      - key: CLOUDFLARE_ENDPOINT
        sync: false
      - key: CLOUDFLARE_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_BUCKET_NAME
        sync: false

      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_TOKEN
        sync: false

  - type: keyvalue
    name: delivery-cache
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: delivery-postgres
    databaseName: delivery
    user: delivery
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
